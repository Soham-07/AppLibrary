{id:'valuation',name:'Valuation',formula:`Varies — often Revenue × Industry multiple, or discounted future cash flows`,def:`An estimate of what a business is worth, used for fundraising, acquisition, or exit.`,warn:`Private company valuations (especially at the funding-round stage) reflect what one investor agreed to pay under specific terms, not a market-tested price — treat headline valuations skeptically.`},
{id:'revenue-multiple',name:'Revenue Multiple',formula:`Valuation ÷ Annual Revenue`,def:`A shorthand way to price a business relative to its revenue, common in SaaS and startup contexts.`,warn:`Multiples swing hard with market sentiment (interest rates, sector hype) — the same business can be "worth" very different multiples eighteen months apart with no operational change.`},
{id:'cagr',name:'CAGR (Compound Annual Growth Rate)',formula:`(Ending Value ÷ Starting Value)^(1 ÷ Years) − 1`,def:`The smoothed annual growth rate that would take a starting value to an ending value over a period, ignoring year-to-year volatility.`,warn:`CAGR can make a genuinely volatile, risky path look smooth and safe in hindsight — it hides the bumps entirely.`},
{id:'irr',name:'IRR (Internal Rate of Return)',formula:`The discount rate that makes an investment's net present value equal zero`,def:`A single percentage summarizing the annualized return of an investment with cash flows at different times.`,warn:`IRR can be misleadingly inflated for investments with an early large cash return, even if the total money made is modest — always look at it next to the actual multiple of money returned.`},
{id:'npv',name:'NPV (Net Present Value)',formula:`Sum of future cash flows, each discounted back to today's value, minus the initial investment`,def:`Whether an investment creates value once you account for the fact that money today is worth more than money later.`,warn:`Wildly sensitive to the discount rate chosen — a small change in assumed discount rate can flip a project from apparently profitable to apparently unprofitable.`},
{id:'market-share',name:'Market Share',formula:`Your revenue (or units) ÷ Total market revenue (or units)`,def:`The portion of a defined market that one company controls.`,warn:`Highly dependent on how the "market" is defined — a company can plausibly claim a large share of a narrowly-defined market and a tiny share of a broadly-defined one.`},
{id:'payback',name:'CAC Payback Period',formula:`CAC ÷ Monthly revenue per customer`,def:`How many months it takes for a customer's revenue to repay the cost of acquiring them.`,warn:`Ignores churn — a customer with a 14-month payback period who typically churns at month 10 never actually pays back, even though the formula suggests they will.`},
{id:'mrr-arr',name:'MRR / ARR',formula:`MRR = total recurring revenue per month; ARR = MRR × 12`,def:`Monthly and Annual Recurring Revenue — the predictable, subscription portion of revenue.`,warn:`One-time or usage-based revenue sometimes gets folded into "recurring" figures to inflate them — check what's actually included.`},
{id:'nps',name:'NPS (Net Promoter Score)',formula:`% Promoters (score 9–10) − % Detractors (score 0–6), on a 0–10 "would you recommend" question`,def:`A single-question proxy for customer satisfaction and likely word-of-mouth growth.`,warn:`Highly sensitive to when and how it's asked (right after a great experience vs. cold) — treat trend over time as more meaningful than any single snapshot.`},
{id:'break-even',name:'Break-Even Point',formula:`Fixed Costs ÷ (Price per unit − Variable cost per unit)`,def:`The sales volume at which total revenue equals total costs — the point profit starts.`,warn:`Assumes price and variable cost per unit stay constant, which often isn't true at higher volumes (discounts, supply constraints) — treat it as an estimate, not a guarantee.`}
];
const PLAYBOOKS = [
{id:'first-client',name:'Landing Your First Freelance Client',cat:'Freelancing',
 steps:[
 `List everyone in your existing network who might need your skill, or knows someone who does — this list is almost always longer than it first feels.`,
 `Reach out with a specific, low-pressure message: what you do, one relevant example, and a direct but soft ask ("would this be useful for you, or anyone you know?").`,
 `For the first project, price to build proof, not to maximize revenue — a strong first case study is worth more than the fee.`,
 `Put scope and payment terms in writing even for a small first job — this is the habit, not the money, that matters here.`,
 `Deliver slightly beyond what was promised on the first project specifically — it's the single highest-leverage thing you can do for referrals.`,
 `Ask directly for a testimonial and a referral immediately after a good delivery, while the good feeling is fresh.`]},

{id:'salary-negotiation',name:'Salary Negotiation',cat:'Career',
 steps:[
 `Research the real market range for the role, level, and location before any number gets discussed.`,
 `Let the employer state a number or range first if possible — delay your own number until after interest is established.`,
 `When you do give a number, use a range anchored at your true walk-away-happy floor.`,
 `Negotiate the full package, not just base — bonus, equity, leave, remote flexibility, start date, and signing bonus are all movable.`,
 `Get any verbal agreement confirmed in writing before treating it as final.`,
 `If declining a counter, do it clearly and professionally — this industry is smaller than it feels.`]},

{id:'job-search',name:'Job Search',cat:'Career',
 steps:[
 `Define the actual target — role, level, industry, location — specifically enough that you could name ten real companies that fit.`,
 `Rebuild the resume around the target's language, not a generic version sent everywhere.`,
 `Prioritize warm referrals over cold applications for at least the first half of your effort.`,
 `Prepare STAR stories for your five most likely behavioral questions before the first interview, not after.`,
 `Track every application and its stage in one place — a search with more than a handful of live threads is unmanageable from memory alone.`,
 `Negotiate every offer, even ones that already feel generous.`]},

{id:'difficult-client',name:'Handling a Difficult Client',cat:'Freelancing',
 steps:[
 `Get specific about what's actually happening — vague dissatisfaction ("difficult") usually has a concrete root cause once named.`,
 `Re-read the original scope document together — most client conflict is a scope-interpretation gap, not bad faith.`,
 `Address it in writing, calmly, stating the gap and proposed resolution — avoid resolving high-stakes disputes only verbally.`,
 `Offer one clear path forward with a boundary attached (a revised scope, a change-order fee, or a firm deadline).`,
 `If the relationship is unrecoverable, exit professionally and promptly rather than dragging out a bad fit — protect the reputation cost of a messy public exit.`]},

{id:'idea-validation',name:'Business Idea Validation',cat:'Entrepreneurship',
 steps:[
 `Write the problem you think exists in one sentence, before writing anything about the solution.`,
 `Find and talk to at least ten people who plausibly have that problem — ask about their current behavior, not their opinion of your idea.`,
 `Look specifically for people already paying for a worse solution — that's a much stronger signal than polite interest.`,
 `Build the smallest possible version that tests the riskiest assumption, not the easiest feature to build.`,
 `Get a real commitment (a pre-order, a deposit, a signed letter of intent) before building further — opinions are free, commitments aren't.`,
 `Set a specific kill criterion in advance — decide now what result would mean you stop, so a sunk-cost feeling can't make that call for you later.`]},

{id:'cold-outreach',name:'Cold Outreach',cat:'Sales / Freelancing',
 steps:[
 `Build a short, specific list of real targets — quality over volume; twenty well-researched contacts beat two hundred generic ones.`,
 `Reference something specific and true about them in the first line — proof you didn't mass-copy the message.`,
 `Lead with their likely problem, not your service — make the first line about them.`,
 `Keep the ask small and specific — a fifteen-minute call, not "let's work together."`,
 `Follow up two to three times, spaced out, before moving on — most replies come after the first message, not from it.`,
 `Track response rates by message version so you're improving the template, not just repeating it.`]},

{id:'layoff-resignation',name:'Layoff or Resignation',cat:'Career',
 steps:[
 `If resigning: line up the next step (offer signed, or a real financial runway) before giving notice, not after.`,
 `If laid off: confirm the exact terms in writing — severance, notice period, benefit continuation, reference policy — before signing anything.`,
 `In either case, request a reference conversation while goodwill is still warm.`,
 `Update your resume and LinkedIn the same week, while the details are fresh.`,
 `File for any applicable unemployment or transition benefits promptly — eligibility windows are often shorter than expected.`,
 `Give yourself a real, bounded reset period rather than starting the next search in a panic the same day.`]},

{id:'investment-research',name:'Researching an Investment Before Buying',cat:'Investing',
 steps:[
 `Write down what you actually understand about how this asset makes money or grows in value — if you can't explain it simply, that's a signal.`,
 `Check the fee structure — small ongoing fee differences compound into large amounts over decades.`,
 `Compare the claimed return against a relevant, boring benchmark (an index fund) over the same period.`,
 `Size the position by what you'd genuinely be fine losing, not by how confident the pitch made you feel.`,
 `Decide your exit or rebalancing rule before buying, not after — plans made after a price move are usually driven by emotion.`]}
];
const SCRIPTS = [
{id:'salary-ask',name:'Salary Negotiation — Initial Ask',cat:'Career',
 note:`Use after an offer is extended, once interest is clearly established.`,
 body:`Thank you for the offer — I'm genuinely excited about [specific detail about the role/team]. Based on my research into this role and level in [location/market], and the scope we discussed, I was expecting something closer to [target number/range]. Is there flexibility to get there?`},

{id:'counter-lowball',name:'Countering a Lowball Offer',cat:'Career / Freelancing',
 note:`Stay factual and specific, not emotional — the goal is to reopen the number, not to argue.`,
 body:`I appreciate you sharing that. Based on [specific market data / comparable scope], I was expecting [target number]. Can you help me understand how this number was arrived at, and whether there's room to move?`},

{id:'cold-email',name:'Cold Outreach Email',cat:'Sales / Freelancing',
 note:`Keep it under 100 words. The specific detail in line one is what separates this from spam.`,
 body:`Hi [Name] — I noticed [specific, true detail about their work/company]. I work with [type of client] on [specific outcome, not a generic service description], most recently helping [brief, concrete result]. Would a fifteen-minute call make sense to see if it's relevant for [their specific situation]? No worries if not.`},

{id:'discovery-open',name:'Discovery Call Opening Questions',cat:'Sales',
 note:`Ask, then stop talking — resist the urge to fill silence while they think.`,
 body:`Before I share anything about what I do, I'd love to understand your side first — what's prompting you to look into this right now? And what does the current situation actually look like day to day?`},

{id:'objection-price',name:`Handling "It's Too Expensive"`,cat:'Sales / Freelancing',
 note:`Isolate before defending the number — "too expensive" sometimes means "not convinced of the value yet," which is a different conversation.`,
 body:`That's fair to raise. Can I ask — is it the number itself, or is it more that the value isn't clear yet relative to the number? [If value] Let's walk through what this actually changes for you. [If number] What range were you expecting, and let's see what scope fits it.`},

{id:'late-payment',name:'Late Payment Follow-Up',cat:'Freelancing',
 note:`Stay professional and factual on the first follow-up — assume oversight before assuming bad faith.`,
 body:`Hi [Name] — following up on invoice [number], due on [date]. Just checking this hasn't gotten buried — could you confirm when payment is expected? Happy to resend anything you need on my end.`},

{id:'decline-client',name:'Declining a Bad-Fit Client or Project',cat:'Freelancing',
 note:`Be clear and brief — over-explaining a decline often invites negotiation you don't want.`,
 body:`Thanks so much for thinking of me for this. After reviewing the scope, I don't think I'm the right fit for this one — [one honest, brief reason if useful]. I'd be glad to point you toward [alternative/referral] if that's helpful.`},

{id:'resignation-open',name:'Resignation Conversation Opener',cat:'Career',
 note:`Keep the initial conversation short and factual; save details for the written notice.`,
 body:`I wanted to let you know directly, before it's official anywhere else — I've decided to move on and my last day will be [date]. I've valued my time here and want to make the transition as smooth as possible.`},

{id:'ask-promotion',name:'Asking for a Promotion',cat:'Career',
 note:`Bring specific evidence, not just tenure — the ask should already answer "why now, why me."`,
 body:`I'd like to talk about my path to [target level/title]. Over the last [period], I've [specific outcome 1], [specific outcome 2], and taken on [specific expanded scope]. I'd like to understand what's needed to formalize a move to [level], and on what timeline.`}

const CASES = [
{id:'netflix-pivot',name:'Netflix — DVD-by-Mail to Streaming',cat:'Business Model / Strategy',
 context:`Netflix built a large, profitable DVD-by-mail rental business in the 2000s, competing successfully against video rental chains.`,
 decision:`Rather than defend the DVD business indefinitely, Netflix invested heavily in streaming technology and licensing well before DVD revenue had actually declined — deliberately cannibalizing its own profitable core business.`,
 incentives:`Management judged that someone was going to disrupt physical rental with streaming eventually; the only choice was whether Netflix did it to itself or a competitor did it to them.`,
 result:`Netflix became the dominant global streaming platform; most of its DVD-era competitors, including large rental chains, did not survive the transition.`,
 mistakes:`A separate 2011 attempt to split DVD and streaming into two services and brands (with an unpopular price restructuring) was reversed quickly after strong customer backlash — a reminder that even a correct long-term strategic bet can be executed poorly in the short term.`,
 lessons:`Cannibalizing your own profitable business on your own terms is often safer than waiting for a competitor to do it on theirs — but execution and communication of a strategic shift matter as much as the strategic call itself.`},

{id:'kodak-digital',name:"Kodak and the Digital Camera",cat:'Innovation / Strategy',
 context:`Kodak's engineers built one of the earliest working digital camera prototypes in the 1970s, well ahead of the market.`,
 decision:`Kodak chose to slow-walk digital photography for years, protecting its highly profitable film and print business rather than aggressively commercializing its own invention.`,
 incentives:`Film and print processing were Kodak's core profit engines; internally, digital cameras looked like a threat to that revenue rather than the future replacement for it.`,
 result:`Competitors moved faster into digital cameras and, later, camera phones displaced dedicated cameras almost entirely. Kodak filed for bankruptcy protection in 2012.`,
 mistakes:`Treating a genuinely disruptive technology as a threat to manage slowly, rather than a new business to build aggressively, even at the cost of the old one.`,
 lessons:`Commonly cited as the textbook case of the "innovator's dilemma" — a company can invent the future and still lose to it, if existing profit incentives make leadership protect the past instead.`},

{id:'airbnb-craigslist',name:'Airbnb — Early Distribution via Craigslist',cat:'Growth / Distribution',
 context:`In its very early days, Airbnb had a good product but almost no way to reach potential hosts and guests at scale.`,
 decision:`The founders built a tool letting Airbnb hosts cross-post their listings to Craigslist — a much larger, existing marketplace — routing that traffic back into Airbnb.`,
 incentives:`Building a new audience from zero is far slower than borrowing distribution from a platform that already has one; the tradeoff was operating in a technical and reputational gray area on a platform that hadn't authorized the integration.`,
 result:`It meaningfully accelerated Airbnb's early listing growth during a period when the company badly needed traction to survive.`,
 mistakes:`The tactic depended on Craigslist not blocking the integration — a real platform-dependency risk that a growth tactic like this always carries.`,
 lessons:`Early-stage distribution can legitimately come from piggybacking on someone else's existing audience — but it's a bridge tactic, not a durable long-term channel, and it shouldn't be confused with sustainable growth infrastructure.`},

{id:'slack-pivot',name:'Slack — Pivoting from a Failed Game',cat:'Entrepreneurship / Pivoting',
 context:`The team behind Slack originally built an online multiplayer game (first Glitch's predecessor, then Glitch itself) that failed to gain a sustainable audience.`,
 decision:`Rather than shut down entirely, the team recognized that the internal communication tool they'd built for their own game-development team was more valuable than the game itself, and pivoted the company around that tool.`,
 incentives:`With investor money already raised and a strong engineering team assembled, the founders judged the team and technology were the real asset — worth redirecting rather than disbanding.`,
 result:`Slack became one of the fastest-growing enterprise software companies of its era and was later acquired by Salesforce for a large sum.`,
 mistakes:`Not a mistake so much as a reminder — the original product thesis was wrong twice before the team found the right one; persistence on the team and capability mattered more than persistence on the original idea.`,
 lessons:`A pivot isn't a failure of the underlying company if the team honestly separates "was this specific idea right" from "is this team and what we've learned still valuable."`},

{id:'overexpansion-edtech',name:'Rapid Overexpansion in Indian Ed-Tech',cat:'Growth / Unit Economics',
 context:`Several Indian ed-tech companies expanded very aggressively during 2020–2022, fueled by high valuations and large acquisition-driven growth, adding large sales teams and acquiring numerous smaller companies.`,
 decision:`Growth was prioritized heavily over near-term unit economics and profitability, on the assumption that scale and market share would eventually convert into durable margins.`,
 incentives:`Investor capital was cheap and readily available during that period, which rewarded visible growth metrics more than it rewarded careful cost discipline.`,
 result:`As funding conditions tightened afterward, several of these companies faced significant valuation markdowns, layoffs, and, in some cases, governance and accounting scrutiny.`,
 mistakes:`Scaling costs (sales teams, acquisitions) faster than the underlying unit economics (cost to acquire and retain a paying student versus revenue per student) had actually been proven at a smaller scale.`,
 lessons:`Growth funded by cheap capital can mask weak unit economics for a long time — but it doesn't fix them. Validating that a smaller version of the business is genuinely profitable, or on a believable path to it, should generally come before scaling it aggressively.`}
];
const HEURISTICS = [
{id:'pareto-h',rule:'The 80/20 Rule',logic:`Roughly 80% of results tend to come from about 20% of causes — an observation, not a mathematical law.`,use:`Finding leverage — which clients, tasks, or channels to double down on.`,misuse:`Used to justify neglecting the "unimportant" 80% entirely — some of it is low-frequency but non-negotiable (compliance, a key relationship).`},
{id:'parkinson',rule:"Parkinson's Law",logic:`Work expands to fill the time allotted for it — a two-week deadline for a two-day task will usually take close to two weeks.`,use:`Setting tighter, more realistic deadlines to force focus.`,misuse:`Compressing deadlines so far that quality genuinely suffers — the law describes slack, not infinite compressibility.`},
{id:'hofstadter',rule:"Hofstadter's Law",logic:`"It always takes longer than expected, even when you account for Hofstadter's Law" — a joke about the persistence of planning-time optimism.`,use:`Padding project estimates deliberately, especially for creative or technical work with unknown unknowns.`,misuse:`Used as an excuse to stop estimating carefully at all — the point is to correct for bias, not to abandon planning.`},
{id:'occam',rule:"Occam's Razor",logic:`Among competing explanations that fit the evidence equally well, the simplest one is usually the right starting bet.`,use:`Diagnosing a business or technical problem — check the boring explanation before the exotic one.`,misuse:`Used to dismiss a genuinely more complex but correct explanation just because it's more complex.`},
{id:'rule72',rule:'The Rule of 72',logic:`Divide 72 by an annual growth or interest rate to roughly estimate how many years it takes to double.`,use:`Quick mental math for comparing investment returns or growth rates without a calculator.`,misuse:`Treated as precise rather than a fast approximation — it degrades in accuracy at very high or very low rates.`},
{id:'chesterton',rule:"Chesterton's Fence",logic:`Don't remove a rule, process, or system until you understand why it was put there in the first place.`,use:`Joining a new team or business and evaluating existing processes before changing them.`,misuse:`Used to justify never changing anything — the point is to understand first, not to preserve everything forever.`},
{id:'two-pizza',rule:'The Two-Pizza Rule',logic:`A team too large to be fed by two pizzas is usually too large to communicate and decide efficiently.`,use:`Sizing project teams or meeting attendee lists.`,misuse:`Applied rigidly to teams whose work genuinely requires broader coordination (large-scale operations, certain manufacturing contexts).`},
{id:'never-split',rule:"Don't Reflexively Split the Difference",logic:`Meeting exactly in the middle of two anchored numbers rewards whoever anchored more aggressively, not whoever has the fairer position.`,use:`Any negotiation where the other side's opening number was clearly an aggressive anchor, not a fair midpoint.`,misuse:`A midpoint split genuinely is reasonable and fast for low-stakes, good-faith negotiations — the heuristic isn't "never compromise," it's "don't compromise reflexively."`},
{id:'sturgeon',rule:"Sturgeon's Law",logic:`Roughly 90% of everything produced in any field is mediocre — a bar-setting heuristic for judging your own early work fairly.`,use:`Reducing perfectionism-driven paralysis on early creative or professional work.`,misuse:`Used to excuse not improving at all — the point is to ship the "90%" and iterate, not to stop caring about quality.`},
{id:'premortem-h',rule:'Assume It Fails, Then Ask Why',logic:`Imagining a decision has already failed makes people far more willing to name real risks than asking "what could go wrong?" in the abstract.`,use:`Any significant, hard-to-reverse decision before committing to it.`,misuse:`Applied to every trivial decision, where the exercise costs more time than the decision is worth.`}
];

const SIGNALS = [
{id:'client-signals',title:'Vetting a New Client',
 good:[`Answers scope and budget questions directly and promptly`,`Has worked with freelancers/agencies before and understands the process`,`References or a track record you can verify`,`Comfortable putting terms in writing`],

{id:'employer-signals',title:'Evaluating an Employer',
 good:[`Interviewers give specific, concrete answers about the role and team, not vague pitches`,`Clear, verifiable information about compensation structure and review cycles`,`Reasonable, respected notice periods for departing employees`,`Low, explainable turnover on the specific team you'd join`],
 bad:[`Interview process is unusually secretive about basic role details`,`Heavy emphasis on "passion" and "hustle" in place of clarity on compensation`,`Consistently high turnover on the team, explained away vaguely`,`Pressure to accept an offer within an unreasonably short window`],},
{id:'investment-signals',title:'Evaluating an Investment Opportunity',
 good:[`Returns claimed are in a plausible range for the stated risk level`,`Fee structure is disclosed clearly and up front`,`You can explain, in your own words, exactly how the underlying asset makes money`,`No pressure to decide within an artificially short window`],

{id:'business-health-signals',title:`Reading a Business's Health`,

const content = document.getElementById('content');
let currentView = {type:'home'};
let pendingFocus = null;

function esc(s){return String(s);}
function highlightPh(s){return s.replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>');}

function fieldRow(label,text){
  return `<div class="field"><div class="fieldLabel">${label}</div><div class="fieldText">${text}</div></div>`;
}

function stamp(text,cls){return `<span class="stamp2 ${cls}">${text}</span>`;}

function cardShell(id,title,sub,stampsHTML,bodyHTML){
  return `<div class="card" id="c-${id}">
    <button class="cardHead" onclick="toggleCard('${id}')">
      <div class="cardHeadL"><div class="cardTitle">${title}</div><div class="cardSub">${sub}</div></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="stampRow">${stampsHTML}</div>
        <div class="chev">▸</div>
      </div>
    </button>
    <div class="cardBody"><div class="cardBodyIn">${bodyHTML}</div></div>
  </div>`;
}

function toggleCard(id){
  const el = document.getElementById('c-'+id);
  if(el) el.classList.toggle('open');
}
window.toggleCard = toggleCard;

/* ---------- HOME ---------- */
function renderHome(){
  const totalTech = TECHNIQUES.length, totalFw = FRAMEWORKS.length, totalMetrics = METRICS.length, totalDomains = DOMAINS.length;
  let h = `
  <div class="heroRow">
    <div>
      <div class="heroKicker">Field Manual · Volume I</div>
      <h2 class="heroTitle">Business, Career &amp;<br>Professional Life</h2>
      <div class="heroDesc">Twenty-two knowledge domains and eight practical systems — frameworks, techniques, scripts, playbooks — built to answer one question over and over: what should I actually do here?</div>
    </div>
    <div class="heroStamp">${totalDomains} DOMAINS<br>${totalFw} FRAMEWORKS<br>${totalTech} TECHNIQUES<br>${totalMetrics} METRICS</div>
  </div>
  <div class="sectionLabel">Domains</div>
  <div class="gridCards">`;
  DOMAINS.forEach(d=>{
    h += `<button class="miniCard" onclick="navigate({type:'domain',id:'${d.id}'})">
      <div class="n">MODULE ${String(d.num).padStart(2,'0')}</div>
      <div class="t">${d.title}</div>
      <div class="d">${d.tag}</div>
    </button>`;
  });
  h += `</div><div class="sectionLabel">The Practical Layer</div><div class="gridCards">`;
  SYSTEMS_META.forEach(s=>{
    h += `<button class="miniCard" onclick="navigate({type:'system',id:'${s.id}'})">
      <div class="n">SYSTEM</div>
      <div class="t">${s.title}</div>
      <div class="d">${s.d}</div>
    </button>`;
  });
  h += `</div>`;
  content.innerHTML = h;
}

/* ---------- DOMAIN PAGE ---------- */
function relatedFor(domain){
  const kw = domain.title.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3);
  const matchTech = TECHNIQUES.filter(t=>kw.some(k=>t.domain.toLowerCase().includes(k)));
  const matchFw = FRAMEWORKS.filter(f=>kw.some(k=>f.cat.toLowerCase().includes(k)));
  return {matchTech,matchFw};
}

function renderDomain(id){
  const d = DOMAINS.find(x=>x.id===id);
  if(!d){renderHome();return;}
  const {matchTech,matchFw} = relatedFor(d);
  let h = `<button class="backBtn" onclick="navigate({type:'home'})">← Index</button>
  <div class="pageHead">
    <div class="pageEyebrow">Module ${String(d.num).padStart(2,'0')} of ${DOMAINS.length}</div>
    <h2 class="pageTitle">${d.title}</h2>
    <div class="pageTag">${d.tag}</div>
  </div>
  <div class="wwhBlock">
    ${wwhRow('WHAT',d.what)}
    ${wwhRow('WHY',d.why)}
    ${wwhRow('HOW',d.how)}
    ${wwhRow('WHEN',d.when)}
    ${wwhRow('WHERE',d.where)}
    ${wwhRow('WHO',d.who)}
  </div>
  <div class="sectionLabel">Key Topics</div>
  <div class="topicList">${d.topics.map(t=>`<div class="topicItem">${t}</div>`).join('')}</div>`;

  if(matchTech.length || matchFw.length){
    h += `<div class="crossRef"><b>Related in the practical layer —</b> `;
    const links = [];
    matchFw.forEach(f=>links.push(`<a href="#" onclick="navigate({type:'system',id:'frameworks'},'${f.id}');return false;">${f.name}</a>`));
    matchTech.forEach(t=>links.push(`<a href="#" onclick="navigate({type:'system',id:'techniques'},'${t.id}');return false;">${t.name}</a>`));
    h += links.join(', ') + `.</div>`;
  }
  content.innerHTML = h;
}
function wwhRow(label,text){
  return `<div class="wwhRow"><div class="wwhLabel">${label}</div><div class="wwhText">${text}</div></div>`;
}

/* ---------- SYSTEM SECTIONS ---------- */
function renderSystem(id){
  const meta = SYSTEMS_META.find(s=>s.id===id);
  if(!meta){renderHome();return;}
  let h = `<button class="backBtn" onclick="navigate({type:'home'})">← Index</button>
  <div class="pageHead">
    <div class="pageEyebrow">Practical Layer</div>
    <h2 class="pageTitle">${meta.title}</h2>
    <div class="pageTag">${meta.d}</div>
  </div>`;

  if(id==='frameworks') h += meta.data.map(renderFrameworkCard).join('');
  else if(id==='techniques') h += meta.data.map(renderTechniqueCard).join('');
  else if(id==='metrics') h += `<div class="metricGrid">` + meta.data.map(renderMetricCard).join('') + `</div>`;
  else if(id==='playbooks') h += meta.data.map(renderPlaybookCard).join('');
  else if(id==='scripts') h += meta.data.map(renderScriptCard).join('');
  else if(id==='cases') h += meta.data.map(renderCaseCard).join('');
  else if(id==='heuristics') h += `<div class="metricGrid">` + meta.data.map(renderHeuristicCard).join('') + `</div>`;
  else if(id==='signals') h += meta.data.map(renderSignalBlock).join('');

  content.innerHTML = h;

  if(pendingFocus){
    const el = document.getElementById('c-'+pendingFocus) || document.getElementById('m-'+pendingFocus);
    if(el){
      el.classList.add('open');
      setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),60);
      el.style.borderColor='var(--gold-dim)';
      setTimeout(()=>{el.style.borderColor='';},2200);
    }
    pendingFocus = null;
  }
}

function renderFrameworkCard(f){
  const body = `<div class="fieldGrid">
    ${fieldRow('WHAT',f.what)}
    ${fieldRow('HOW',f.how)}
    ${fieldRow('WHEN TO USE',f.when)}
    ${fieldRow('WHEN IT FAILS',f.fails)}
    ${fieldRow('EXAMPLE',f.example)}
  </div>`;
  return cardShell(f.id, f.name, f.cat, stamp(f.cat,'stamp-neutral'), body);
}

function renderTechniqueCard(t){
  const steps = t.how.map(s=>`<li>${s}</li>`).join('');
  const body = `<div class="fieldGrid">
    ${fieldRow('WHAT',t.what)}
    ${fieldRow('MECHANISM',t.mechanism)}
    <div class="field"><div class="fieldLabel">HOW TO EXECUTE</div><div class="fieldText"><ul class="stepList">${steps}</ul></div></div>
    ${fieldRow('WHEN TO USE',t.when)}
    ${fieldRow('WHEN NOT TO',t.whenNot)}
    ${fieldRow('EXAMPLE',t.example)}
    ${fieldRow('COUNTERMEASURE',t.countermeasure)}
  </div>`;
  const stamps = stamp(t.domain,'stamp-neutral') + stamp(t.difficulty,'stamp-medium') + stamp('Risk: '+t.risk,'stamp-'+t.risk);
  return cardShell(t.id, t.name, t.domain, stamps, body);
}

function renderMetricCard(m){
  return `<div class="metricCard" id="c-${m.id}">
    <div class="mt">${m.name}</div>
    <div class="mf">${m.formula}</div>
    <div class="md">${m.def}</div>
    <div class="mw"><b>Misleading when —</b> ${m.warn}</div>
  </div>`;
}

function renderPlaybookCard(p){
  const steps = p.steps.map(s=>`<li>${s}</li>`).join('');
  const body = `<ul class="stepList">${steps}</ul>`;
  return cardShell(p.id, p.name, p.cat, stamp(p.cat,'stamp-neutral'), body);
}

function renderScriptCard(s){
  const body = `<div class="fieldGrid">
    ${fieldRow('WHEN',s.note)}
  </div>
  <div class="scriptBox">${highlightPh(s.body)}</div>`;
  return cardShell(s.id, s.name, s.cat, stamp(s.cat,'stamp-neutral'), body);
}

function renderCaseCard(c){
  const body = `<div class="fieldGrid">
    ${fieldRow('CONTEXT',c.context)}
    ${fieldRow('DECISION',c.decision)}
    ${fieldRow('INCENTIVES',c.incentives)}
    ${fieldRow('RESULT',c.result)}
    ${fieldRow('MISTAKES',c.mistakes)}
    ${fieldRow('LESSONS',c.lessons)}
  </div>`;
  return cardShell(c.id, c.name, c.cat, stamp(c.cat,'stamp-neutral'), body);
}

function renderHeuristicCard(h){
  return `<div class="metricCard" id="c-${h.id}">
    <div class="mt">${h.rule}</div>
    <div class="md" style="margin-bottom:8px;">${h.logic}</div>
    <div class="md"><b style="color:var(--olive);">Use —</b> ${h.use}</div>
    <div class="mw"><b>Misuse —</b> ${h.misuse}</div>
  </div>`;
}

function renderSignalBlock(s){
  return `<div class="card open" id="c-${s.id}" style="margin-bottom:20px;">
    <div class="cardHead" style="cursor:default;"><div class="cardHeadL"><div class="cardTitle">${s.title}</div></div></div>
    <div class="cardBody" style="max-height:none;"><div class="cardBodyIn">
      <div class="flagCols">
        <div class="flagCol good"><h4>Green Flags</h4><ul>${s.good.map(g=>`<li>${g}</li>`).join('')}</ul></div>
        <div class="flagCol bad"><h4>Red Flags</h4><ul>${s.bad.map(b=>`<li>${b}</li>`).join('')}</ul></div>
      </div>
    </div></div>
  </div>`;
}

/* ---------- NAV ---------- */
function buildNav(){
  const rail = document.getElementById('railNav');
  let h = `<div class="navGroup"><div class="navGroupLabel">Domains</div>`;
  DOMAINS.forEach(d=>{
    h += `<button class="navItem" data-nav="domain:${d.id}" onclick="navigate({type:'domain',id:'${d.id}'})">
      <span class="n">${String(d.num).padStart(2,'0')}</span><span>${d.title}</span></button>`;
  });
  h += `</div><div class="navGroup"><div class="navGroupLabel">Practical Layer</div>`;
  SYSTEMS_META.forEach(s=>{
    h += `<button class="navItem" data-nav="system:${s.id}" onclick="navigate({type:'system',id:'${s.id}'})">
      <span class="n">·</span><span>${s.title}</span></button>`;
  });
  h += `</div>`;
  rail.innerHTML = h;
}

function updateNavActive(){
  document.querySelectorAll('.navItem').forEach(el=>el.classList.remove('active'));
  let key = null;
  if(currentView.type==='domain') key = 'domain:'+currentView.id;
  else if(currentView.type==='system') key = 'system:'+currentView.id;
  if(key){
    const el = document.querySelector(`[data-nav="${key}"]`);
    if(el) el.classList.add('active');
  }
}

function navigate(view, focusId){
  currentView = view;
  pendingFocus = focusId || null;
  if(view.type==='home') renderHome();
  else if(view.type==='domain') renderDomain(view.id);
  else if(view.type==='system') renderSystem(view.id);
  updateNavActive();
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('searchInput').value='';
  closeRailMobile();
  window.scrollTo(0,0);
}
window.navigate = navigate;

/* ---------- SEARCH ---------- */
let SEARCH_INDEX = [];
function buildSearchIndex(){
  DOMAINS.forEach(d=>SEARCH_INDEX.push({type:'Domain',view:{type:'domain',id:d.id},title:d.title,meta:d.tag,text:(d.what+' '+d.topics.join(' ')).toLowerCase()}));
  FRAMEWORKS.forEach(f=>SEARCH_INDEX.push({type:'Framework',view:{type:'system',id:'frameworks'},focus:f.id,title:f.name,meta:f.cat,text:(f.what+' '+f.how).toLowerCase()}));
  TECHNIQUES.forEach(t=>SEARCH_INDEX.push({type:'Technique',view:{type:'system',id:'techniques'},focus:t.id,title:t.name,meta:t.domain,text:(t.what+' '+t.mechanism).toLowerCase()}));
  METRICS.forEach(m=>SEARCH_INDEX.push({type:'Metric',view:{type:'system',id:'metrics'},focus:m.id,title:m.name,meta:m.formula,text:(m.def+' '+m.warn).toLowerCase()}));
  PLAYBOOKS.forEach(p=>SEARCH_INDEX.push({type:'Playbook',view:{type:'system',id:'playbooks'},focus:p.id,title:p.name,meta:p.cat,text:p.steps.join(' ').toLowerCase()}));
  SCRIPTS.forEach(s=>SEARCH_INDEX.push({type:'Script',view:{type:'system',id:'scripts'},focus:s.id,title:s.name,meta:s.cat,text:s.body.toLowerCase()}));
  CASES.forEach(c=>SEARCH_INDEX.push({type:'Case',view:{type:'system',id:'cases'},focus:c.id,title:c.name,meta:c.cat,text:(c.context+' '+c.lessons).toLowerCase()}));
  HEURISTICS.forEach(h=>SEARCH_INDEX.push({type:'Heuristic',view:{type:'system',id:'heuristics'},focus:h.id,title:h.rule,meta:'',text:h.logic.toLowerCase()}));
}

function runSearch(q){
  const results = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  if(q.length<2){results.classList.remove('show');results.innerHTML='';return;}
  const hits = SEARCH_INDEX.filter(it=>it.title.toLowerCase().includes(q) || it.text.includes(q) || (it.meta||'').toLowerCase().includes(q)).slice(0,18);
  if(!hits.length){results.innerHTML = `<div class="srItem"><div class="srMeta">No matches. Try a shorter term.</div></div>`;results.classList.add('show');return;}
  results.innerHTML = hits.map((h,i)=>`<button class="srItem" style="width:100%;background:none;border:none;text-align:left;" onclick='searchNavigate(${i})'>
    <div class="srType">${h.type}</div><div class="srTitle">${h.title}</div><div class="srMeta">${h.meta||''}</div>
  </button>`).join('');
  window.__hits = hits;
  results.classList.add('show');
}
function searchNavigate(i){
  const h = window.__hits[i];
  navigate(h.view, h.focus);
}
window.searchNavigate = searchNavigate;

/* ---------- MOBILE RAIL ---------- */
function closeRailMobile(){
  document.getElementById('rail').classList.remove('open');
  document.getElementById('railScrim').classList.remove('show');
}
document.getElementById('railToggle').addEventListener('click',()=>{
  document.getElementById('rail').classList.toggle('open');
  document.getElementById('railScrim').classList.toggle('show');
});
document.getElementById('railScrim').addEventListener('click',closeRailMobile);

/* ---------- INIT ---------- */
document.getElementById('searchInput').addEventListener('input',e=>runSearch(e.target.value));
document.addEventListener('click',e=>{
  if(!document.getElementById('searchWrap').contains(e.target)){
    document.getElementById('searchResults').classList.remove('show');
  }
});

buildNav();
renderStatPills();
buildSearchIndex();
navigate({type:'home'});
</script>
</body>
</html>
