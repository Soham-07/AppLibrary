<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger — A Professional's Guide to Salary, Tax & Career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ledger-green: #0F3D2E;
    --ledger-green-light: #1A5940;
    --paper: #F0EBE0;
    --paper-dark: #E5DDCC;
    --ink: #1A2332;
    --ink-light: #4A5265;
    --amber: #C17817;
    --amber-light: #E8A94F;
    --rule: #8A8578;
    --rule-light: #C9C3B4;
    --white: #FDFCF9;
    --red-stamp: #8B2E2E;

    --font-display: 'Source Serif 4', serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--amber-light); color: var(--ink); }

  a { color: inherit; }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--paper); }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 0; }

  /* ===== TOP BAR ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--ledger-green);
    color: var(--paper);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px double var(--amber);
  }

  .topbar-brand {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar-brand .stamp-mark {
    width: 28px; height: 28px;
    border: 2px solid var(--amber);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    font-family: var(--font-mono);
    color: var(--amber);
    flex-shrink: 0;
  }

  .search-wrap {
    position: relative;
    flex: 0 1 340px;
  }

  #searchInput {
    width: 100%;
    padding: 9px 14px 9px 36px;
    border: 1px solid var(--ledger-green-light);
    background: rgba(253,252,249,0.08);
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 0.9rem;
    border-radius: 3px;
    outline: none;
    transition: background 0.2s, border-color 0.2s;
  }
  #searchInput::placeholder { color: rgba(240,235,224,0.5); }
  #searchInput:focus { background: rgba(253,252,249,0.14); border-color: var(--amber); }

  .search-icon {
    position: absolute;
    left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 0.85rem;
    opacity: 0.6;
    pointer-events: none;
  }

  #searchResults {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--white);
    border: 1px solid var(--rule-light);
    border-radius: 4px;
    max-height: 400px;
    overflow-y: auto;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    z-index: 200;
  }
  #searchResults.active { display: block; }
  .search-result-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--paper-dark);
    cursor: pointer;
    color: var(--ink);
    font-size: 0.88rem;
  }
  .search-result-item:hover { background: var(--paper); }
  .search-result-item .sr-chapter {
    font-size: 0.72rem;
    color: var(--ledger-green);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 2px;
  }
  .search-result-item:last-child { border-bottom: none; }

  /* ===== LAYOUT SHELL ===== */
  .shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 60px);
  }

  /* ===== SIDEBAR — LEDGER TABS ===== */
  .sidebar {
    background: var(--paper-dark);
    border-right: 2px solid var(--rule-light);
    padding: 20px 0;
    position: sticky;
    top: 61px;
    height: calc(100vh - 61px);
    overflow-y: auto;
  }

  .sidebar-group {
    margin-bottom: 4px;
  }

  .sidebar-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    font-size: 0.88rem;
    color: var(--ink-light);
    transition: all 0.15s;
    text-decoration: none;
  }

  .sidebar-item .tab-num {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--rule);
    flex-shrink: 0;
    width: 20px;
  }

  .sidebar-item:hover {
    background: rgba(15,61,46,0.06);
    color: var(--ink);
    border-left-color: var(--rule);
  }

  .sidebar-item.active {
    background: var(--ledger-green);
    color: var(--paper);
    border-left-color: var(--amber);
    font-weight: 500;
  }
  .sidebar-item.active .tab-num { color: var(--amber-light); }

  .sidebar-progress-track {
    margin: 16px 20px 20px;
    padding-top: 16px;
    border-top: 1px solid var(--rule-light);
  }

  .progress-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--rule);
    margin-bottom: 6px;
  }

  .progress-bar-bg {
    height: 6px;
    background: var(--paper);
    border: 1px solid var(--rule-light);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--amber);
    width: 4%;
    transition: width 0.4s;
  }
  #progressText { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-light); margin-top: 4px; }

  /* ===== MAIN CONTENT ===== */
  main {
    padding: 0;
    max-width: 900px;
  }

  .chapter {
    display: none;
    padding: 48px 56px 80px;
    animation: fadeIn 0.3s ease;
  }
  .chapter.active { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .chapter-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--amber);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chapter-eyebrow::before {
    content: '';
    width: 24px; height: 1px;
    background: var(--amber);
  }

  .chapter-title {
    font-family: var(--font-display);
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--ledger-green);
    margin-bottom: 12px;
    line-height: 1.15;
  }

  .chapter-intro {
    font-size: 1.05rem;
    color: var(--ink-light);
    max-width: 640px;
    margin-bottom: 36px;
    padding-bottom: 28px;
    border-bottom: 2px solid var(--rule-light);
  }

  /* ===== TOPIC CARD (ledger entry) ===== */
  .topic {
    margin-bottom: 8px;
    border: 1px solid var(--rule-light);
    background: var(--white);
    border-radius: 4px;
    overflow: hidden;
  }

  .topic-head {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .topic-head:hover { background: var(--paper); }

  .topic-name {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--ink);
  }

  .topic-toggle {
    font-family: var(--font-mono);
    color: var(--rule);
    font-size: 1rem;
    transition: transform 0.2s;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .topic.open .topic-toggle { transform: rotate(45deg); color: var(--amber); }

  .topic-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .topic.open .topic-body { max-height: 4000px; }

  .topic-body-inner {
    padding: 4px 20px 24px;
    border-top: 1px solid var(--paper-dark);
  }

  .wwh-grid {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 6px 16px;
    margin: 16px 0;
  }
  .wwh-label {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ledger-green);
    font-weight: 700;
    padding-top: 2px;
  }
  .wwh-value { font-size: 0.94rem; color: var(--ink); padding-bottom: 10px; }

  .callout {
    margin: 14px 0;
    padding: 12px 16px;
    border-left: 3px solid var(--amber);
    background: #FBF3E4;
    font-size: 0.9rem;
    border-radius: 0 4px 4px 0;
  }
  .callout-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--amber);
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  .callout.trap { border-left-color: var(--red-stamp); background: #FAECEC; }
  .callout.trap .callout-label { color: var(--red-stamp); }

  .callout.right { border-left-color: var(--ledger-green); background: #EAF2ED; }
  .callout.right .callout-label { color: var(--ledger-green); }

  /* payslip line item table */
  .calc-table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-family: var(--font-mono);
    font-size: 0.86rem;
  }
  .calc-table th {
    text-align: left;
    padding: 8px 10px;
    background: var(--ledger-green);
    color: var(--paper);
    font-weight: 500;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .calc-table td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--paper-dark);
  }
  .calc-table tr:last-child td {
    border-top: 2px solid var(--ink);
    border-bottom: none;
    font-weight: 700;
    color: var(--ledger-green);
  }
  .calc-table td.num { text-align: right; }

  .tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .tag {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 10px;
    background: var(--paper-dark);
    color: var(--ink-light);
  }
  .tag.mandatory { background: #FAECEC; color: var(--red-stamp); }
  .tag.optional { background: #EAF2ED; color: var(--ledger-green); }
  .tag.taxable { background: #FEF3E2; color: var(--amber); }
  .tag.taxfree { background: #E8F0E9; color: var(--ledger-green-light); }

  /* Chapter summary block */
  .chapter-summary {
    margin-top: 40px;
    padding: 24px 28px;
    background: var(--ledger-green);
    color: var(--paper);
    border-radius: 6px;
    position: relative;
  }
  .chapter-summary::before {
    content: 'SUMMARY';
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--amber-light);
    display: block;
    margin-bottom: 10px;
  }
  .chapter-summary ul { padding-left: 20px; }
  .chapter-summary li { margin-bottom: 6px; font-size: 0.92rem; }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 2px solid var(--rule-light);
  }
  .nav-btn {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    padding: 10px 18px;
    background: var(--white);
    border: 1px solid var(--ledger-green);
    color: var(--ledger-green);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--ledger-green); color: var(--paper); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover { background: var(--white); color: var(--ledger-green); }

  /* ===== HERO / CHAPTER 0 ===== */
  .hero {
    padding: 56px 56px 40px;
  }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-size: 3rem;
    font-weight: 700;
    color: var(--ledger-green);
    line-height: 1.1;
    margin-bottom: 20px;
  }
  .hero-sub {
    font-size: 1.1rem;
    color: var(--ink-light);
    max-width: 600px;
    margin-bottom: 40px;
  }

  /* Interactive CTC breakdown - signature element */
  .ctc-machine {
    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 40px;
    position: relative;
  }
  .ctc-machine::before {
    content: 'LIVE CALCULATOR';
    position: absolute;
    top: -11px; left: 24px;
    background: var(--amber);
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 3px;
  }
  .ctc-input-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .ctc-input-row label {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--ink-light);
  }
  #ctcInput {
    font-family: var(--font-mono);
    font-size: 1.3rem;
    font-weight: 700;
    padding: 8px 14px;
    border: 2px solid var(--ledger-green);
    border-radius: 4px;
    width: 200px;
    color: var(--ledger-green);
  }
  #ctcSlider { flex: 1; min-width: 180px; accent-color: var(--amber); }

  .regime-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--ledger-green);
    border-radius: 4px;
    overflow: hidden;
    margin-left: auto;
  }
  .regime-btn {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 7px 14px;
    background: var(--white);
    color: var(--ledger-green);
    cursor: pointer;
    border: none;
  }
  .regime-btn.active { background: var(--ledger-green); color: var(--paper); }

  #payslipOutput { margin-top: 20px; }

  .ctc-bar {
    display: flex;
    height: 40px;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid var(--ink);
  }
  .ctc-bar-seg {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: white;
    overflow: hidden;
    white-space: nowrap;
    transition: width 0.3s;
  }

  .payslip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 640px) { .payslip-grid { grid-template-columns: 1fr; } }

  .payslip-col-title {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ledger-green);
    border-bottom: 2px solid var(--ledger-green);
    padding-bottom: 6px;
    margin-bottom: 8px;
  }
  .payslip-col-title.ded { color: var(--red-stamp); border-bottom-color: var(--red-stamp); }

  .payslip-line {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.84rem;
    padding: 5px 0;
    border-bottom: 1px dotted var(--rule-light);
  }
  .payslip-line.total {
    font-weight: 700;
    border-bottom: none;
    border-top: 2px solid var(--ink);
    margin-top: 6px;
    padding-top: 8px;
  }

  .takehome-stamp {
    margin-top: 20px;
    padding: 18px 24px;
    background: var(--ledger-green);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .takehome-label { font-family: var(--font-mono); font-size: 0.78rem; color: var(--paper); text-transform: uppercase; letter-spacing: 0.05em; }
  .takehome-value { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; color: var(--amber-light); }

  .roadmap-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-top: 8px;
  }
  .roadmap-card {
    background: var(--white);
    border: 1px solid var(--rule-light);
    border-left: 4px solid var(--ledger-green);
    padding: 18px 20px;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .roadmap-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,61,46,0.12); }
  .roadmap-card .rc-phase {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .roadmap-card h4 {
    font-family: var(--font-display);
    font-size: 1.1rem;
    color: var(--ledger-green);
    margin: 6px 0 6px;
  }
  .roadmap-card p { font-size: 0.85rem; color: var(--ink-light); }

  /* Mobile */
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar {
      position: static;
      height: auto;
      display: flex;
      overflow-x: auto;
      padding: 10px;
      white-space: nowrap;
    }
    .sidebar-item { border-left: none; border-bottom: 3px solid transparent; flex-shrink: 0; }
    .sidebar-item.active { border-left: none; border-bottom-color: var(--amber); }
    .sidebar-progress-track { display: none; }
    .chapter { padding: 32px 20px 60px; }
    .hero { padding: 32px 20px 20px; }
    .hero-title { font-size: 2.1rem; }
    .search-wrap { flex: 1; }
    .topbar { flex-wrap: wrap; gap: 10px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand"><span class="stamp-mark">₹</span> THE LEDGER</div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search any topic — HRA, notice period, TDS...">
    <div id="searchResults"></div>
  </div>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="mainContent"></main>
</div>

<script>
// ============================================================
// THE LEDGER — Content Data
// Structure: CHAPTERS[] each with { id, tabLabel, eyebrow, title, intro, topics[] }
// Each topic: { name, tags[], wwh: {What, Why, How, When/Where, Who}, calc(optional table),
//               callouts[] {type: 'trap'|'right'|'note', label, text} }
// ============================================================

const CHAPTERS = [];

// ---------- CHAPTER 1: SALARY FUNDAMENTALS ----------
CHAPTERS.push({
  id: "fundamentals",
  tabLabel: "Salary Fundamentals",
  eyebrow: "Chapter 1 — Foundations",
  title: "What Your Salary Actually Is",
  intro: "Before you can negotiate, save, or plan anything, you need to understand the difference between the number a company promises you and the number that lands in your bank account. This gap confuses almost every fresher — and companies count on that confusion.",
  topics: [
    {
      name: "CTC — Cost to Company",
      tags: ["Foundational"],
      wwh: {
        "What": "CTC is the total amount a company spends on you in a year — not just what they pay you, but everything: your salary, their contribution to your PF, insurance premiums they pay on your behalf, gratuity provisions, and perks like a company laptop or cab service.",
        "Why": "Companies use CTC because it lets them quote one big, impressive number in the offer letter while the actual cash you receive is meaningfully lower. It's also genuinely useful for them internally — it's their real cost of employing you, used for budgeting.",
        "How": "CTC = Basic + HRA + Allowances + Employer's PF contribution + Gratuity + Insurance premiums + Bonuses + Perks/reimbursements. Every one of these is added up into one number.",
        "Where": "Used in offer letters, appointment letters, and internal HR/finance planning across almost every company in India."
      },
      calc: {
        headers: ["Component", "Annual (₹)"],
        rows: [
          ["Basic Salary", "6,00,000"],
          ["HRA", "3,00,000"],
          ["Special Allowance", "2,10,000"],
          ["Employer PF (12% of Basic)", "72,000"],
          ["Gratuity Provision", "28,846"],
          ["Insurance Premium", "15,000"],
          ["Total CTC", "12,25,846"]
        ]
      },
      callouts: [
        { type: "trap", label: "The trap", text: "A ₹12 LPA offer sounds like ₹1 lakh a month. It isn't. Roughly 25-35% of CTC never touches your bank account — it goes to PF, gratuity, and insurance that you either can't access now or don't receive as cash." },
        { type: "right", label: "What to actually do", text: "Never compare two job offers by CTC alone. Always ask for a detailed breakup and calculate estimated take-home before deciding." }
      ]
    },
    {
      name: "Gross Salary",
      tags: ["Foundational"],
      wwh: {
        "What": "Gross salary is your CTC minus the components that never come to you directly as cash in a payslip — mainly employer's PF contribution, gratuity, and employer-paid insurance. It's the sum of all salary heads before any deductions are taken out.",
        "Why": "It exists as a mid-point number: bigger than take-home (because taxes and employee-side deductions haven't been removed yet), smaller than CTC (because employer-only contributions are excluded).",

<script>
// ============================================================

let currentChapterIdx = 0; // 0 = hero
let visitedChapters = new Set();

function init() {
  renderSidebar();
  renderHero();
  renderAllChapters();

  setupSearch();

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = `<div class="sidebar-item ${currentChapterIdx === 0 ? 'active' : ''}" data-idx="0" onclick="showChapter(0)">
    <span class="tab-num">00</span><span>Start Here</span>
  </div>`;

  });

    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div id="progressText">0 / ${CHAPTERS.length} chapters visited</div>
  </div>`;

}

function updateProgress() {
  const pct = Math.round((visitedChapters.size / CHAPTERS.length) * 100);
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  if (fill) fill.style.width = pct + '%';
  if (text) text.textContent = `${visitedChapters.size} / ${CHAPTERS.length} chapters visited`;
}

function showChapter(idx) {
  currentChapterIdx = idx;
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
  });

  if (idx === 0) {
    document.getElementById('heroSection').classList.add('active');
  } else {
    const ch = CHAPTERS[idx - 1];
    document.getElementById('chapter-' + ch.id).classList.add('active');
    visitedChapters.add(ch.id);
    updateProgress();
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function goToChapterById(id) {
  const i = CHAPTERS.findIndex(c => c.id === id);

}

// ===== HERO / START HERE =====

let currentRegime = 'new';
function setRegime(r) {
  currentRegime = r;
  document.querySelectorAll('.regime-btn').forEach(b => b.classList.toggle('active', b.dataset.regime === r));
  renderPayslip();
}
function syncCtcFromInput() {
  const val = document.getElementById('ctcInput').value;
  document.getElementById('ctcSlider').value = val;
  renderPayslip();
}
function syncCtcFromSlider() {
  const val = document.getElementById('ctcSlider').value;
  document.getElementById('ctcInput').value = val;
  renderPayslip();
}

function calcTaxNewRegime(taxableIncome) {
  // FY 2025-26 style new regime slabs (approx, for illustration)
  const slabs = [
    [300000, 0], [700000, 0.05], [1000000, 0.10],
    [1200000, 0.15], [1500000, 0.20], [Infinity, 0.30]
  ];
  let tax = 0, prev = 0;
  for (const [limit, rate] of slabs) {
    if (taxableIncome > prev) {
      const slice = Math.min(taxableIncome, limit) - prev;
      tax += slice * rate;
      prev = limit;
    } else break;
  }
  // rebate under 87A roughly for income <= 7L in new regime
  if (taxableIncome <= 700000) tax = 0;
  return tax * 1.04; // 4% cess
}

function calcTaxOldRegime(taxableIncome) {
  const slabs = [
    [250000, 0], [500000, 0.05], [1000000, 0.20], [Infinity, 0.30]
  ];
  let tax = 0, prev = 0;
  for (const [limit, rate] of slabs) {
    if (taxableIncome > prev) {
      const slice = Math.min(taxableIncome, limit) - prev;
      tax += slice * rate;
      prev = limit;
    } else break;
  }
  if (taxableIncome <= 500000) tax = 0;
  return tax * 1.04;
}

function renderPayslip() {
  const ctc = parseFloat(document.getElementById('ctcInput').value) || 0;
  if (ctc <= 0) return;

  // Simplified realistic structure
  const basic = ctc * 0.42;
  const hra = basic * 0.5;
  const employerPF = Math.min(basic, 180000) * 0.12; // capped-ish ballpark
  const gratuity = basic * (15/26)/12 * 12; // annualized provision approx
  const insurance = ctc * 0.012;
  const specialAllowance = ctc - basic - hra - employerPF - gratuity - insurance;

  const grossAnnual = basic + hra + Math.max(specialAllowance, 0);
  const employeePF = Math.min(basic, 180000) * 0.12;
  const professionalTax = 2500;

  // Standard deduction + rough taxable income estimate
  const standardDeduction = currentRegime === 'new' ? 75000 : 50000;
  let taxableIncome = grossAnnual - standardDeduction;
  if (currentRegime === 'old') {
    // assume some 80C utilization reduces taxable income a bit for illustration
    taxableIncome -= Math.min(150000, employeePF + 50000);
    taxableIncome = Math.max(taxableIncome, 0);
  }
  const annualTax = currentRegime === 'new' ? calcTaxNewRegime(taxableIncome) : calcTaxOldRegime(taxableIncome);

  const annualDeductions = employeePF + (professionalTax) + annualTax;
  const netAnnual = grossAnnual - annualDeductions;
  const netMonthly = netAnnual / 12;

  const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');

  const barSegs = [
    { label: 'Basic', val: basic, color: '#0F3D2E' },
    { label: 'HRA', val: hra, color: '#1A5940' },
    { label: 'Special', val: Math.max(specialAllowance,0), color: '#4A5265' },
    { label: 'PF (Employer)', val: employerPF, color: '#8A8578' },
    { label: 'Gratuity', val: gratuity, color: '#C17817' },
    { label: 'Insurance', val: insurance, color: '#E8A94F' }
  ];
  const total = barSegs.reduce((s,x) => s + x.val, 0) || 1;

  const html = `
    <div class="ctc-bar">
      ${barSegs.map(s => `<div class="ctc-bar-seg" style="width:${(s.val/total*100).toFixed(1)}%; background:${s.color};" title="${s.label}: ${fmt(s.val)}">${(s.val/total*100) > 8 ? s.label : ''}</div>`).join('')}
    </div>
    <div class="payslip-grid">
      <div>
        <div class="payslip-col-title">Earnings (Annual)</div>
        <div class="payslip-line"><span>Basic Salary</span><span>${fmt(basic)}</span></div>
        <div class="payslip-line"><span>HRA</span><span>${fmt(hra)}</span></div>
        <div class="payslip-line"><span>Special Allowance</span><span>${fmt(Math.max(specialAllowance,0))}</span></div>
        <div class="payslip-line total"><span>Gross Salary</span><span>${fmt(grossAnnual)}</span></div>
      </div>
      <div>
        <div class="payslip-col-title ded">Deductions (Annual)</div>
        <div class="payslip-line"><span>Employee PF</span><span>${fmt(employeePF)}</span></div>
        <div class="payslip-line"><span>Professional Tax</span><span>${fmt(professionalTax)}</span></div>
        <div class="payslip-line"><span>Income Tax (est., ${currentRegime === 'new' ? 'New' : 'Old'} Regime)</span><span>${fmt(annualTax)}</span></div>
        <div class="payslip-line total"><span>Total Deductions</span><span>${fmt(annualDeductions)}</span></div>
      </div>
    </div>
    <div class="takehome-stamp">
      <span class="takehome-label">Estimated Monthly Take-Home</span>
      <span class="takehome-value">${fmt(netMonthly)}</span>
    </div>
  `;
  document.getElementById('payslipOutput').innerHTML = html;
}

// ===== RENDER CHAPTERS =====
function renderAllChapters() {
  const main = document.getElementById('mainContent');
  CHAPTERS.forEach(ch => {
    const div = document.createElement('div');
    div.className = 'chapter';
    div.id = 'chapter-' + ch.id;

function renderChapterContent(ch) {
  const idx = CHAPTERS.findIndex(c => c.id === ch.id);
  const topicsHtml = ch.topics.map((t, ti) => renderTopic(t, ch.id, ti)).join('');

  const prevDisabled = idx === 0 ? '' : '';
  const nextChapterId = idx < CHAPTERS.length - 1 ? CHAPTERS[idx + 1].id : null;

  return `
    <div class="chapter-eyebrow">${ch.eyebrow}</div>
    <h1 class="chapter-title">${ch.title}</h1>
    <p class="chapter-intro">${ch.intro}</p>
    <div class="topics-list">${topicsHtml}</div>
    <div class="chapter-summary">
      <ul>${ch.topics.slice(0,5).map(t => `<li>${t.name} — know the difference between what's mandatory and what's optional, and whether it's taxable.</li>`).join('')}</ul>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn" onclick="showChapter(${idx})">&larr; ${idx === 0 ? 'Start Here' : CHAPTERS[idx-1].tabLabel}</button>
      ${nextChapterId ? `<button class="nav-btn" onclick="goToChapterById('${nextChapterId}')">${CHAPTERS[idx+1].tabLabel} &rarr;</button>` : `<button class="nav-btn" disabled>You've reached the end &#10003;</button>`}
    </div>
  `;
}

function renderTopic(t, chapterId, ti) {
  const topicId = `topic-${chapterId}-${ti}`;
  const tagsHtml = (t.tags || []).map(tag => {
    const lower = tag.toLowerCase();
    let cls = '';
    if (lower.includes('mandatory')) cls = 'mandatory';
    else if (lower.includes('optional')) cls = 'optional';
    else if (lower.includes('taxable') && !lower.includes('tax-exempt') && !lower.includes('non')) cls = 'taxable';
    else if (lower.includes('exempt') || lower.includes('tax-free')) cls = 'taxfree';
    return `<span class="tag ${cls}">${tag}</span>`;
  }).join('');

  const wwhHtml = Object.entries(t.wwh || {}).map(([label, val]) =>
    `<div class="wwh-label">${label.toUpperCase()}</div><div class="wwh-value">${val}</div>`
  ).join('');

  let calcHtml = '';
  if (t.calc) {
    calcHtml = `<table class="calc-table">
      <tr><th>${t.calc.headers[0]}</th><th style="text-align:right;">${t.calc.headers[1]}</th></tr>
      ${t.calc.rows.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join('')}
    </table>`;
  }

  const calloutsHtml = (t.callouts || []).map(c =>
    `<div class="callout ${c.type}"><span class="callout-label">${c.label}</span>${c.text}</div>`
  ).join('');

  return `
    <div class="topic" id="${topicId}">
      <div class="topic-head" onclick="toggleTopic('${topicId}')">
        <span class="topic-name">${t.name}</span>
        <span class="topic-toggle">+</span>
      </div>
      <div class="topic-body">
        <div class="topic-body-inner">
          <div class="tag-row">${tagsHtml}</div>
          <div class="wwh-grid">${wwhHtml}</div>
          ${calcHtml}
          ${calloutsHtml}
        </div>
      </div>
    </div>
  `;
}

function toggleTopic(id) {
  document.getElementById(id).classList.toggle('open');
}

// ===== SEARCH =====
let searchIndex = [];
function buildSearchIndex() {
  CHAPTERS.forEach((ch, ci) => {
    ch.topics.forEach((t, ti) => {
      const text = (t.name + ' ' + Object.values(t.wwh || {}).join(' ')).toLowerCase();
      searchIndex.push({ chapterId: ch.id, chapterLabel: ch.tabLabel, chapterIdx: ci, topicIdx: ti, name: t.name, text });
    });
  });
}

function setupSearch() {
  buildSearchIndex();
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { results.classList.remove('active'); return; }
    const matches = searchIndex.filter(item => item.text.includes(q)).slice(0, 8);
    if (matches.length === 0) {
      results.innerHTML = `<div class="search-result-item" style="color:var(--rule);">No matches. Try a shorter term.</div>`;
    } else {
      results.innerHTML = matches.map(m =>
        `<div class="search-result-item" onclick="jumpToTopic('${m.chapterId}', ${m.topicIdx})">
          <span class="sr-chapter">${m.chapterLabel}</span>${m.name}
        </div>`
      ).join('');
    }
    results.classList.add('active');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) results.classList.remove('active');
  });
}

function jumpToTopic(chapterId, topicIdx) {
  goToChapterById(chapterId);
  document.getElementById('searchResults').classList.remove('active');
  document.getElementById('searchInput').value = '';
  setTimeout(() => {
    const el = document.getElementById(`topic-${chapterId}-${topicIdx}`);
    if (el) {
      el.classList.add('open');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.transition = 'background 0.3s';
      el.style.background = '#FBF3E4';
      setTimeout(() => { el.style.background = ''; }, 1500);
    }
  }, 100);
}

init();

</script>
